# Flatpak-Manifest für Emilia — Desktop-Variante (x86_64 und aarch64-Desktops).
# Die Phone-Variante (FuriOS/Droidian/Halium, direkter Kamerazugriff, ohne den
# rmcp/tokio-MCP-Backend) ist de.cais.Emilia.phone.yaml; beide teilen sich die
# Modul-Dateien unter flatpak/ (dort einmal ändern, gilt für beide).
#
# Lokal bauen & installieren:
#   flatpak install flathub org.gnome.Platform//49 org.gnome.Sdk//49 \
#       org.freedesktop.Sdk.Extension.rust-stable//25.08
#   flatpak-builder --user --install --force-clean build-dir de.cais.Emilia.yaml
#   flatpak run de.cais.Emilia
#
# Der Build läuft offline: Die Cargo-Abhängigkeiten sind in
# generated-sources.json gevendort (erzeugt mit flatpak-cargo-generator aus
# Cargo.lock) und werden mit `cargo build --offline` verwendet. Nach Änderungen an
# den Abhängigkeiten (Cargo.lock) muss generated-sources.json neu erzeugt werden:
#   .flathub-tools/venv/bin/python .flathub-tools/flatpak-cargo-generator.py \
#       Cargo.lock -o generated-sources.json
id: de.cais.Emilia
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: emilia

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Audio (PipeWire über die Pulse-Kompatibilität der Runtime)
  - --socket=pulseaudio
  # Online-Metadaten **und** Geräte-Synchronisierung im LAN (HTTPS-Server/-Client)
  - --share=network
  # Kamera für den QR-Scan (Geräte-Synchronisierung, Nextcloud-Login) läuft über
  # das XDG-Kamera-Portal (org.freedesktop.portal.Camera, PipeWire-Stream) —
  # kein `--device=all` nötig; die Dekodierung passiert in-process (rqrr).
  # Siehe src/core/sync/scanner.rs.
  - --device=dri
  # Musikbibliothek: Standardzugriff nur auf den XDG-Musikordner. Weitere
  # Ordner werden über den GTK-Dateidialog ausgewählt; Schreibzugriff im
  # Musikordner ist für Stream-Aufnahmen und per Sync empfangene Audiodateien
  # nötig.
  - --filesystem=xdg-music
  # Sperrbildschirm/Medientasten: eigener MPRIS-Name (pro Prozess-Suffix)
  - --own-name=org.mpris.MediaPlayer2.Emilia.*
  # Sicherheitskritische Daten (Nextcloud-Benutzername/-App-Passwort sowie API-
  # Keys/Tokens wie AcoustID/fanart.tv) werden, wenn verfügbar, über libsecret
  # im Secret Service statt in der lokalen SQLite-Datenbank gespeichert.
  - --talk-name=org.freedesktop.secrets
  # Optionales Tray-Icon (StatusNotifierItem) – Registrierung beim Tray-Host.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Übersetzungskataloge liegen privat unter /app (nicht in der Locale-Extension,
  # die nur die Gerätesprachen installiert), damit der eingebaute Sprachwähler
  # jede Sprache laden kann – unabhängig von der Systemsprache.
  - --env=EMILIA_LOCALEDIR=/app/share/emilia/translations

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Kein Netzzugriff beim Build: cargo nutzt ausschließlich die vendored Crates.
  env:
    CARGO_HOME: /run/build/emilia/cargo

modules:
  - flatpak/chromaprint.yaml
  - flatpak/yt-dlp.yaml
  - flatpak/emilia.yaml
