# Flatpak module for Emilia — shared by de.cais.Emilia.yaml (desktop) and
# de.cais.Emilia.phone.yaml (phone). Paths are relative to this file.
#
# AcoustID-Fingerprint (fpcalc) mitliefern, damit die Track-Erkennung über
# Chromaprint auch im Flatpak funktioniert (die Runtime enthält fpcalc nicht).
# Gebaut mit dem in Chromaprint gebündelten KissFFT (keine externe FFT-
# Abhängigkeit) und libswresample aus der Runtime zum Dekodieren; installiert
# libchromaprint + fpcalc nach /app. Siehe src/core/fingerprint.rs.
name: chromaprint
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_TOOLS=ON
  - -DBUILD_TESTS=OFF
  - -DFFT_LIB=kissfft
  - -DAUDIO_PROCESSOR_LIB=swresample
sources:
  - type: archive
    url: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-1.6.2.tar.gz
    sha256: d54ada62c16b2db396d3251ec54fc7a58909c163131a1cfcf7fa6407dbc14360
