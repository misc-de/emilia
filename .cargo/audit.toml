# cargo-audit policy (CI job "Dependency audit").
#
# Advisories that only warn (unmaintained / unsound crates) never fail the job;
# the entries below are *vulnerabilities* that are consciously accepted because
# they cannot be fixed from this side of the tree and do not apply to how the
# crate is used here. Each one names the path and the reason — re-check them
# whenever the dependency in question gets an update.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa: "Marvin attack" timing side channel in RSA
    # private-key operations. Reaches Emilia through the SMB client's
    # authentication stack (smb -> sspi -> picky -> rsa), where Emilia is a
    # *client* and holds no private key, and directly through the AirPlay 1
    # receiver/sender (src/core/cast/airplay.rs, raop.rs). The only private
    # key there is the AirPort Express key every AirPlay 1 device uses — it
    # has been public since 2011, so the side channel has nothing secret to
    # leak. The fix shipped in rsa 0.10.0, but sspi (also its newest 0.23.1)
    # and picky (7.0.0-rc.29) pin the 0.10.0-rc.18 candidate exactly and smb
    # 0.12.1 pins sspi 0.21.3 — Cargo allows one 0.10 version per tree, so the
    # direct use cannot move ahead alone (re-checked 2026-11-20).
    "RUSTSEC-2023-0071",
]
