[package]
name = "emilia"
version = "0.8.28"
edition = "2021"
description = "Adaptiver Musik- & Hörspielplayer für Phosh (GTK4/libadwaita)"
license = "GPL-3.0-or-later"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita", "gnome_46"] }
relm4-components = "0.9"
gtk = { version = "0.9", package = "gtk4" }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gstreamer = "0.23"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
mpris-server = "0.10.0"
# Already pulled in transitively by mpris-server; declared directly to call the
# XDG camera portal (blocking API) in the QR scanner, so the desktop Flatpak
# needs no `--device=all`. See src/core/sync/scanner.rs.
zbus = "5"
rss = { version = "2.1.0", default-features = false }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
httparse = "1"
socket2 = "0.6"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18.1"
# sha2 0.10: the `sspi` crate (NTLM for the SMB client) pins sha2 0.11.0-rc.2, which
# cannot coexist with a stable 0.11 in one lockfile; 0.10 has the same API.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
qrcode = { version = "0.14.1", default-features = false }
async-channel = "2.5"
quick-xml = "0.41"
# SMB2/3 client for "SMB share" music sources — pure Rust (NTLM via `sspi`), so
# the Flatpak needs neither libsmbclient nor a gvfs backend on the host. The
# synchronous `multi_threaded` model is used (no tokio); see src/core/smb.rs.
smb = { version = "0.11.2", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
percent-encoding = "2"
gstreamer-app = "0.23"
# QR *decoding* (camera scanner). default-features off → drop the heavy `image`
# integration; we feed a raw grayscale buffer via `prepare_from_greyscale`.
rqrr = { version = "0.10.1", default-features = false }
# Optional desktop tray icon (StatusNotifierItem). Pure-Rust over zbus — no C
# deps, Flatpak-friendly. Runs its own background thread; commands are bridged
# back to the glib main loop via an `async-channel` (see src/core/tray.rs).
ksni = "0.2"
# X11 backend access for the optional "hide from taskbar" window hint
# (`_NET_WM_STATE_SKIP_TASKBAR`). GTK4 dropped the high-level setter, so we send
# the EWMH client message ourselves; no-op on Wayland. See src/ui/app_tray.rs.
gdk4-x11 = "0.9"
x11rb = "0.13"
# Optional "Tokio SDK" MCP backend (the lean JSON-RPC backend needs none of
# this). rmcp's streamable-HTTP transport pulls in an async (tokio/axum/hyper)
# HTTP stack, so the whole group sits behind the `mcp-sdk` feature (on by
# default; phone builds pass `--no-default-features`). See src/core/mcp.
rmcp = { version = "1", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
# TLS for the "public (LAN)" SDK case, reusing the same rustls 0.23 identity as
# device sync. Pinned to the matching rustls major.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "io-util"], optional = true }

[features]
default = ["mcp-sdk"]
# The rmcp/tokio "Tokio SDK" MCP backend. Without it only the lean JSON-RPC
# backend is compiled and the settings offer just that one; a saved "sdk"
# choice then falls back to JSON-RPC. Phones build with `--no-default-features`
# (smaller binary, ~40 fewer crates).
mcp-sdk = ["dep:rmcp", "dep:axum", "dep:axum-server", "dep:tokio"]

[profile.release]
opt-level = "s"
lto = true
strip = true

# CI gates on `clippy -- -D warnings`. These few pedantic/style lints are
# consciously allowed project-wide: GTK/relm4 closures and DB row tuples are
# legitimately "complex", UI builders legitimately take many arguments, and the
# markdown-rendering doc lint is too noisy for the doc style used here. Genuine
# correctness lints stay denied.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
enum_variant_names = "allow"
doc_lazy_continuation = "allow"
